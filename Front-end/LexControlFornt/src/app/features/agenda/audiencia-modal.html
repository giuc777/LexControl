<app-modal titulo="Nueva Audiencia" [abierto]="true" (cerrado)="alCerrar()">
    <form class="modal-form" (submit)="alEnviar($event)" novalidate>
        <fieldset>
            <legend>Datos de la audiencia</legend>
            <div class="form-grid">
                <div class="field full">
                    <label for="audExpedienteId">Expediente <span class="req">*</span></label>
                    <select id="audExpedienteId" data-testid="select-expediente"
                        [(ngModel)]="expedienteId" name="expedienteId">
                        <option value="0" disabled>Seleccionar expediente...</option>
                        @for (exp of expedientes(); track exp.id) {
                            <option [value]="exp.id">{{ exp.noExpediente }} — {{ exp.cliente }}</option>
                        }
                    </select>
                </div>
                <div class="field">
                    <label for="audTipo">Tipo de audiencia <span class="req">*</span></label>
                    <select id="audTipo" data-testid="select-tipo"
                        [(ngModel)]="tipoId" name="tipoId">
                        <option value="0" disabled>Seleccionar...</option>
                        @for (tipo of tipos(); track tipo.id) {
                            <option [value]="tipo.id">{{ tipo.nombre }}</option>
                        }
                    </select>
                </div>
                <div class="field">
                    <label for="audEstado">Estado <span class="req">*</span></label>
                    <select id="audEstado" data-testid="select-estado"
                        [(ngModel)]="estadoId" name="estadoId">
                        <option value="0" disabled>Seleccionar...</option>
                        @for (estado of estados(); track estado.id) {
                            <option [value]="estado.id">{{ estado.nombre }}</option>
                        }
                    </select>
                </div>
                <div class="field">
                    <label for="audJuzgado">Juzgado <span class="req">*</span></label>
                    <select id="audJuzgado" data-testid="select-juzgado"
                        [(ngModel)]="juzgadoId" name="juzgadoId">
                        <option value="0" disabled>Seleccionar...</option>
                        @for (juzgado of juzgados(); track juzgado.id) {
                            <option [value]="juzgado.id">{{ juzgado.nombre }}</option>
                        }
                    </select>
                </div>
                <div class="field">
                    <label for="audSala">Sala</label>
                    <input type="text" id="audSala" data-testid="input-sala"
                        [(ngModel)]="sala" name="sala"
                        maxlength="50" placeholder="Ej: Sala 1">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Fecha y hora</legend>
            <div class="form-grid">
                <div class="field">
                    <label for="audFecha">Fecha <span class="req">*</span></label>
                    <input type="date" id="audFecha" data-testid="input-fecha"
                        [(ngModel)]="fecha" name="fecha">
                </div>
                <div class="field">
                    <label for="audHoraInicio">Hora inicio <span class="req">*</span></label>
                    <input type="time" id="audHoraInicio" data-testid="input-hora-inicio"
                        [(ngModel)]="horaInicio" name="horaInicio">
                </div>
                <div class="field">
                    <label for="audHoraFin">Hora fin</label>
                    <input type="time" id="audHoraFin" data-testid="input-hora-fin"
                        [(ngModel)]="horaFin" name="horaFin">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Observaciones</legend>
            <div class="form-grid">
                <div class="field full">
                    <label for="audNotas">Notas</label>
                    <textarea id="audNotas" data-testid="input-notas"
                        [(ngModel)]="notas" name="notas"
                        rows="3" maxlength="500"
                        placeholder="Detalles adicionales de la audiencia..."></textarea>
                </div>
            </div>
        </fieldset>

        @if (error()) {
            <p class="form-error" role="alert">{{ error() }}</p>
        }

        <footer class="modal-footer">
            <button type="button" class="btn-secondary" (click)="alCerrar()">Cancelar</button>
            <button type="submit" class="btn-primary" data-testid="btn-guardar-audiencia"
                [disabled]="guardando()">
                @if (guardando()) {
                    Guardando...
                } @else {
                    Guardar Audiencia
                }
            </button>
        </footer>
    </form>
</app-modal>
