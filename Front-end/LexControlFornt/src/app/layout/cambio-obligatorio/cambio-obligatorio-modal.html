<app-modal [titulo]="'Cambio obligatorio de contraseña'" [abierto]="abierto()" ancho="min(520px,94vw)"
    [puedeCerrar]="false">
    <form class="modal-form" [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
        <div class="aj-temporal-aviso" role="alert" data-testid="obligatorio-aviso">
            Su contraseña actual es <strong>temporal</strong>. Por seguridad debe crear una nueva
            contraseña antes de continuar usando el sistema.
        </div>

        <div class="form-error" role="alert" data-testid="obligatorio-error" [hidden]="!mensajeError()">
            {{ mensajeError() }}
        </div>

        @for (campo of campos; track campo.id) {
            <div class="aj-pass-field">
                <div class="field">
                    <label [for]="campo.id">{{ campo.etiqueta }}</label>
                    <input [type]="estaVisible(campo.control) ? 'text' : 'password'" [id]="campo.id"
                        [formControlName]="campo.control" [placeholder]="campo.placeholder"
                        [attr.autocomplete]="campo.autocomplete" [attr.data-testid]="campo.id">
                    <button type="button" class="aj-eye" (click)="alternarVisible(campo.control)"
                        aria-label="Mostrar u ocultar contraseña" title="Mostrar / ocultar">
                        <svg appIcono [appIcono]="estaVisible(campo.control) ? iconoOjoOff : iconoOjo"></svg>
                    </button>
                </div>
            </div>
        }

        <p class="aj-hint">
            La contraseña debe tener al menos 8 caracteres, un número y un carácter especial.
        </p>

        <footer class="modal-footer">
            <button type="button" class="btn-secondary" data-testid="btn-cerrar-sesion-obligatorio"
                (click)="cerrarSesion()">
                Cerrar sesión
            </button>
            <button type="submit" class="btn-primary" data-testid="btn-guardar-obligatorio"
                [disabled]="guardando()">
                {{ guardando() ? 'Guardando…' : 'Guardar contraseña' }}
            </button>
        </footer>
    </form>
</app-modal>
